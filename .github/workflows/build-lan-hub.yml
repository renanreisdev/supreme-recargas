name: Build Agil OS LAN Hub (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "hub-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Test & Build Windows Installer (.exe)
        shell: pwsh
        run: |
          .\hub-local\build-windows.ps1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/hub-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hub-local/dist/AgilOS-Hub-Setup.exe
            hub-local/dist/AgilOS-Hub.exe
            hub-local/dist/SHA256SUMS.txt
          generate_release_notes: true
